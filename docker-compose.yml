services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: oshus
      POSTGRES_PASSWORD: oshus
      POSTGRES_DB: oshus_store
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
